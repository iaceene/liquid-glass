name: Release & Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to npmjs.org'
        required: true
        type: boolean
        default: true
      publish_github:
        description: 'Publish to GitHub Packages'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build library distribution
        run: npm run build

      - name: Create package tarball
        run: npm pack

      - name: Publish to GitHub Packages
        if: ${{ github.event_name == 'release' || inputs.publish_github != false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          npm publish --registry=https://npm.pkg.github.com
        continue-on-error: true

      - name: Publish to npm (registry.npmjs.org)
        if: ${{ github.event_name == 'release' || inputs.publish_npm != false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning ::NPM_TOKEN secret is not set. Skipping npmjs.org publish."
          else
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
            npm publish --access public --registry=https://registry.npmjs.org
          fi

      - name: Attach tarball to GitHub Release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} *.tgz --clobber
